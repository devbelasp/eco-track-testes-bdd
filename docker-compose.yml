# EcoTrack - aplicacao + banco de dados (PostgreSQL real) + testes BDD
# Subir API e banco:   docker compose up --build -d --wait
# Rodar os testes BDD: docker compose --profile tests run --rm tests
# (copie .env.example para .env antes)
name: eco-track

services:
  db:
    image: postgres:16-alpine
    container_name: ecotrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      # Publicada so em localhost, para acessar com DBeaver/pgAdmin se quiser
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a "docker compose down"
      - db_data:/var/lib/postgresql/data
    networks:
      - ecotrack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ecotrack-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      # "db" e o nome do servico acima: a rede do compose resolve o endereco
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PWD: ${POSTGRES_PASSWORD}
    networks:
      - ecotrack-net

  # Testes BDD (Cucumber + Rest Assured) rodando em container, contra a API acima.
  # So sobe quando pedido, por causa do "profile": nao interfere no "docker compose up".
  tests:
    profiles: ["tests"]
    build: ./tests-bdd
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8080
    volumes:
      # Relatorios do Cucumber ficam disponiveis na sua maquina em tests-bdd/target
      - ./tests-bdd/target:/tests/target
    networks:
      - ecotrack-net

volumes:
  db_data:

networks:
  ecotrack-net:
    driver: bridge
